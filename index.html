<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5c6066">
  <title>Mocap Stage</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --accent:#8ec9ff; --glass:rgba(28,30,34,.56); --line:rgba(255,255,255,.14); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; overflow:hidden; touch-action:none;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(circle at 50% 28%, #b9bdc2 0%, #7b8087 55%, #50545a 100%); color:#fff; }
    model-viewer { position:absolute; inset:0; width:100%; height:100%;
      background:transparent; --poster-color:transparent; }

    .glass { background:var(--glass); border:1px solid var(--line);
      -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
      box-shadow:0 8px 28px rgba(0,0,0,.28); }

    /* top bar */
    #top { position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px; right:12px;
      display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
    #brand { padding:9px 14px; border-radius:16px; line-height:1.15; }
    #brand b { display:block; font-size:12px; letter-spacing:.16em; font-weight:700; }
    #brand span { font-size:11px; opacity:.75; }
    #tr { display:flex; gap:8px; pointer-events:auto; }
    .round { width:42px; height:42px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; border:0; color:#fff; padding:0; }
    .round svg { width:20px; height:20px; }
    #anim { display:none; padding:0 14px; width:auto; border-radius:21px; font-size:12px; font-weight:600; }

    /* measurements card */
    #mcard { position:absolute; top:calc(env(safe-area-inset-top,0px) + 70px); left:12px;
      padding:12px 14px; border-radius:16px; font-size:13px; display:none; min-width:190px; }
    #mcard h4 { margin:0 0 8px; font-size:11px; letter-spacing:.14em; opacity:.8; font-weight:700; }
    #mcard .row { display:flex; align-items:center; gap:8px; margin:5px 0; }
    #mcard i { width:10px; height:10px; border-radius:50%; display:inline-block; }
    #mcard .row span { opacity:.8; width:50px; }
    #mcard .row b { font-weight:600; }

    #dims { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
    #dims text { font-size:13px; font-weight:700; paint-order:stroke; stroke:rgba(0,0,0,.65);
      stroke-width:4px; stroke-linejoin:round; text-anchor:middle; }

    /* toast */
    #toast { position:absolute; left:50%; transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom,0px) + 98px); padding:9px 16px; border-radius:20px;
      font-size:13px; opacity:0; transition:opacity .35s; pointer-events:none; white-space:nowrap; }
    #toast.show { opacity:1; }

    /* dock */
    #dock { position:absolute; left:50%; transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; gap:4px; padding:6px;
      border-radius:28px; width:calc(100% - 24px); max-width:420px; }
    #dock button { flex:1; border:0; background:transparent; color:#fff; border-radius:22px;
      padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
      font-size:10.5px; font-weight:600; letter-spacing:.02em; transition:background .2s, opacity .2s; }
    #dock button svg { width:23px; height:23px; }
    #dock button.on { background:rgba(255,255,255,.2); color:var(--accent); }
    #dock button.dim { opacity:.35; }

    /* joystick panel */
    #jpanel { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
      display:none; justify-content:space-between; align-items:flex-end; padding:12px 18px 8px;
      border-radius:24px; touch-action:none; max-width:420px; margin:0 auto; }
    .jb { text-align:center; font-size:11px; font-weight:600; letter-spacing:.08em; opacity:.95; }
    .pad { position:relative; width:104px; height:104px; border-radius:50%; margin:0 auto 6px;
      background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.45); touch-action:none; }
    .knob { position:absolute; left:30px; top:30px; width:44px; height:44px; border-radius:50%;
      background:rgba(255,255,255,.92); box-shadow:0 2px 8px rgba(0,0,0,.4); pointer-events:none; }

    /* overlays */
    .ov { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
      justify-content:center; gap:16px; text-align:center; padding:28px;
      background:radial-gradient(circle at 50% 30%, #aeb2b7 0%, #6e737a 60%, #484c52 100%); }
    .ov h1 { margin:0; font-size:15px; letter-spacing:.24em; font-weight:700; }
    .ov p { margin:0; font-size:14px; opacity:.85; line-height:1.5; max-width:260px; }
    #loading { display:flex; z-index:5; }
    #lbar { width:200px; height:4px; border-radius:2px; background:rgba(255,255,255,.3); overflow:hidden; }
    #lfill { height:100%; width:0; background:#fff; transition:width .25s; }
    #start { z-index:6; }
    #start button { padding:15px 34px; font-size:16px; font-weight:600; border:0; border-radius:30px;
      background:#fff; color:#2a2d31; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="Mocap_Truss_web.glb"
    autoplay
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    min-camera-orbit="auto auto 0.1m"
    max-camera-orbit="auto auto 200m"
    shadow-intensity="0"
    interaction-prompt="none"
    field-of-view="65deg"
    alt="Mocap stage truss">
    <div slot="progress-bar"></div>
  </model-viewer>

  <svg id="dims"></svg>

  <div id="top">
    <div id="brand" class="glass"><b>MOCAP STAGE</b><span id="sub">Stage view</span></div>
    <div id="tr">
      <button id="anim" class="glass round">Animation: On</button>
      <button id="b-reset" class="glass round" aria-label="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
    </div>
  </div>

  <div id="mcard" class="glass">
    <h4>STAGE SIZE</h4>
    <div class="row"><i style="background:#ff6b63"></i><span>Width</span><b id="mw"></b></div>
    <div class="row"><i style="background:#4cd07d"></i><span>Depth</span><b id="md"></b></div>
    <div class="row"><i style="background:#5aa9ff"></i><span>Height</span><b id="mh"></b></div>
  </div>

  <div id="toast" class="glass"></div>

  <div id="jpanel" class="glass">
    <div class="jb"><div class="pad" id="padMove"><div class="knob" id="knMove"></div></div>MOVE</div>
    <div class="jb"><div class="pad" id="padLook"><div class="knob" id="knLook"></div></div>LOOK</div>
  </div>

  <div id="dock" class="glass">
    <button id="b-meas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>
      Measure
    </button>
    <button id="b-motion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2.2-6-2.7-2.5 1.2-4.2 3.5 1.2 2.6 2.8M11.2 15l3.8 1.5 1 4.5M7 9.5l3.7-2"/></svg>
      Motion
    </button>
    <button id="b-joy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8h11a4.5 4.5 0 014.4 5.5l-.7 3a2.6 2.6 0 01-4.4 1.2L15 15.5H9l-1.8 2.2a2.6 2.6 0 01-4.4-1.2l-.7-3A4.5 4.5 0 016.5 8z"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="15.5" cy="11" r=".6" fill="currentColor"/><circle cx="17.5" cy="13" r=".6" fill="currentColor"/></svg>
      Joystick
    </button>
    <button id="b-3d">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M12 12l8.5-4.7M12 12v9.5M12 12L3.5 7.3"/></svg>
      3D View
    </button>
    <button id="b-ar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16"/><path d="M12 8l3.5 2v4L12 16l-3.5-2v-4z"/></svg>
      AR
    </button>
  </div>

  <div id="start" class="ov">
    <h1>MOCAP STAGE</h1>
    <p>Stand on the marked spot and face the QR code.</p>
    <button id="b-start">Enter</button>
  </div>

  <div id="loading" class="ov">
    <h1>MOCAP STAGE</h1>
    <div id="lbar"><div id="lfill"></div></div>
    <p id="ltxt">Loading 0%<br>Hold your phone upright, facing the QR code</p>
  </div>

  <script>
    // ===== START POINT (locked) =====
    // x, z = metres from the CENTRE of the stage.  yaw = direction faced at the start:
    // 0 = toward -z, 90 = toward +x, 180 = toward +z, 270 = toward -x.
    const SPOT = { x: -7.0, z: 7.6, yaw: 0 };
    // ================================

    // ===== SETTINGS =====
    const EYE = 1.6;          // eye height above the floor, metres
    const STEP_LEN = 0.75;    // metres moved per detected step (Motion button)
    const STEP_THRESH = 0.7;  // lower = more sensitive step detection
    const WALK_RATE = 3;      // how quickly a step is applied, metres per second
    const SPEED = 1.5;        // joystick walking speed, metres per second
    const LOOK_YAW = 70;      // look joystick turn speed, degrees per second
    const LOOK_PITCH = 45;    // look joystick up/down speed
    const R = 1;              // keep as is
    // ====================

    // Testing only: change the start from the link, e.g.  ?x=-8&z=9&yaw=270  (add &debug=1 to see numbers)
    const qs = new URLSearchParams(location.search);
    ['x', 'z', 'yaw'].forEach(k => { const v = parseFloat(qs.get(k)); if (!isNaN(v)) SPOT[k] = v; });
    const DEBUG = qs.get('debug') === '1';
    const baseYaw = SPOT.yaw * Math.PI / 180;

    const $ = id => document.getElementById(id);
    const mv = $('mv'), svg = $('dims'), toastEl = $('toast');
    const bMeas = $('b-meas'), bMotion = $('b-motion'), b3d = $('b-3d'), bAr = $('b-ar');
    const NS = 'http://www.w3.org/2000/svg';
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const m2 = v => v.toFixed(2) + ' m  ·  ' + (v * 3.28084).toFixed(1) + ' ft';

    let cx = 0, cz = 0, floorY = 0;
    const eyeY = () => floorY + EYE;

    let mode = 'look';                       // 'look' or 'orbit'
    let px = 0, pz = 0;
    let view = { dx:0, dy:0, dz:-1, theta:0, phi:90, hh:0 };
    let sensHH = 0, sensP = 0, offset = null, lastHeading = 0, gotSensor = false;
    let dirty = true, listening = false, ready = false;
    let yawOff = 0, pitchOff = 0;
    let motionOn = false, dimsOn = false, animOn = true;
    let pending = 0, lastStep = 0, base = 9.8, prevHp = 0;

    const needsPerm = typeof DeviceOrientationEvent !== 'undefined' &&
                      typeof DeviceOrientationEvent.requestPermission === 'function';
    const evName = ('ondeviceorientationabsolute' in window)
      ? 'deviceorientationabsolute' : 'deviceorientation';

    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    // ---------- camera ----------
    function computeView() {
      const hh = sensHH + yawOff + baseYaw;
      const p = clamp(sensP + pitchOff, -1.3, 1.3);
      view.hh = hh;
      view.dx = Math.cos(p) * Math.sin(hh);
      view.dy = Math.sin(p);
      view.dz = -Math.cos(p) * Math.cos(hh);
      view.theta = Math.atan2(-view.dx, -view.dz) * 180 / Math.PI;
      view.phi = Math.acos(-view.dy) * 180 / Math.PI;
    }
    function applyView() {
      if (typeof mv.jumpCameraToGoal !== 'function') return;
      mv.cameraTarget = `${px + view.dx*R}m ${eyeY() + view.dy*R}m ${pz + view.dz*R}m`;
      mv.cameraOrbit = `${view.theta}deg ${view.phi}deg ${R}m`;
      mv.jumpCameraToGoal();
    }
    function goToSpot() { px = cx + SPOT.x; pz = cz + SPOT.z; pending = 0; yawOff = 0; pitchOff = 0; dirty = true; }

    // ---------- sensors ----------
    function dirFromEuler(a, b, gm) {
      const d = Math.PI / 180; a *= d; b *= d; gm *= d;
      const x = -Math.sin(gm)*Math.cos(a) - Math.sin(b)*Math.cos(gm)*Math.sin(a);
      const y = -Math.sin(gm)*Math.sin(a) + Math.sin(b)*Math.cos(gm)*Math.cos(a);
      const z = -Math.cos(b)*Math.cos(gm);
      return { X: x, Y: z, Z: -y };
    }
    function onOrient(e) {
      if (e.alpha === null || e.alpha === undefined) return;
      const v = dirFromEuler(e.alpha, e.beta, e.gamma);
      const h = Math.atan2(v.X, -v.Z);
      sensP = Math.asin(clamp(v.Y, -1, 1));
      lastHeading = h; gotSensor = true;
      if (offset === null) offset = h;
      sensHH = h - offset;
      dirty = true;
    }
    function onStep(e) {
      if (mode !== 'look' || !ready || !motionOn) return;
      const a = e.accelerationIncludingGravity;
      if (!a || a.x === null || a.x === undefined) return;
      const m = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
      base = base * 0.98 + m * 0.02;
      const hp = m - base;
      const now = performance.now();
      if (hp > STEP_THRESH && prevHp <= STEP_THRESH && now - lastStep > 300) {
        lastStep = now; pending = Math.min(pending + STEP_LEN, 3);
      }
      prevHp = hp;
    }
    async function startSensors() {
      try {
        if (needsPerm) {
          await DeviceOrientationEvent.requestPermission();
          if (typeof DeviceMotionEvent !== 'undefined' &&
              typeof DeviceMotionEvent.requestPermission === 'function') {
            await DeviceMotionEvent.requestPermission();
          }
        }
      } catch (err) {}
      if (!listening) {
        window.addEventListener(evName, onOrient, true);
        window.addEventListener('devicemotion', onStep, true);
        listening = true;
      }
    }
    function stopSensors() {
      window.removeEventListener(evName, onOrient, true);
      window.removeEventListener('devicemotion', onStep, true);
      listening = false;
    }

    // ---------- joysticks ----------
    function makeJoy(pad, knob, state) {
      const MAXR = 30; let id = null;
      function move(e) {
        const r = pad.getBoundingClientRect();
        let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
        const l = Math.hypot(x, y);
        if (l > MAXR) { x = x / l * MAXR; y = y / l * MAXR; }
        knob.style.transform = `translate(${x}px,${y}px)`;
        state.x = x / MAXR; state.y = -y / MAXR;
      }
      function end() { id = null; state.x = 0; state.y = 0; knob.style.transform = 'translate(0,0)'; }
      pad.addEventListener('pointerdown', e => { id = e.pointerId; pad.setPointerCapture(id); move(e); e.preventDefault(); });
      pad.addEventListener('pointermove', e => { if (e.pointerId === id) move(e); });
      pad.addEventListener('pointerup', end);
      pad.addEventListener('pointercancel', end);
    }
    const moveS = { x:0, y:0 }, lookS = { x:0, y:0 };
    makeJoy($('padMove'), $('knMove'), moveS);
    makeJoy($('padLook'), $('knLook'), lookS);

    // ---------- measurement lines ----------
    let corners = null, defs = [], els = [];
    function buildDims() {
      const d = mv.getDimensions(), c = mv.getBoundingBoxCenter();
      const x0 = c.x - d.x/2, x1 = c.x + d.x/2, y0 = c.y - d.y/2, y1 = c.y + d.y/2;
      const z0 = c.z - d.z/2, z1 = c.z + d.z/2;
      corners = { A:[x0,y0,z1], B:[x1,y0,z1], C:[x1,y0,z0], D:[x1,y1,z1] };
      mv.querySelectorAll('.hs').forEach(n => n.remove());
      for (const k in corners) {
        const b = document.createElement('button');
        b.className = 'hs'; b.slot = 'hotspot-' + k;
        b.setAttribute('data-position', corners[k].map(v => v + 'm').join(' '));
        b.setAttribute('data-normal', '0 1 0');
        b.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;';
        mv.appendChild(b);
      }
      defs = [
        { a:'A', b:'B', color:'#ff6b63', label:'Width ' + d.x.toFixed(2) + ' m' },
        { a:'B', b:'C', color:'#4cd07d', label:'Depth ' + d.z.toFixed(2) + ' m' },
        { a:'B', b:'D', color:'#5aa9ff', label:'Height ' + d.y.toFixed(2) + ' m' }
      ];
      $('mw').textContent = m2(d.x); $('md').textContent = m2(d.z); $('mh').textContent = m2(d.y);
      svg.innerHTML = '';
      els = defs.map(df => {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('stroke', df.color); l.setAttribute('stroke-width', '4');
        l.setAttribute('stroke-linecap', 'round');
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('fill', df.color); t.textContent = df.label;
        svg.appendChild(l); svg.appendChild(t);
        return { l, t };
      });
    }
    function inFront(p) {
      if (mode !== 'look') return true;
      return (p[0]-px)*view.dx + (p[1]-eyeY())*view.dy + (p[2]-pz)*view.dz > 0.2;
    }
    function drawDims() {
      if (!dimsOn || !corners) { svg.style.display = 'none'; return; }
      svg.style.display = 'block';
      defs.forEach((df, i) => {
        const ha = mv.queryHotspot('hotspot-' + df.a), hb = mv.queryHotspot('hotspot-' + df.b);
        const { l, t } = els[i];
        if (!ha || !hb || !inFront(corners[df.a]) || !inFront(corners[df.b])) {
          l.style.display = 'none'; t.style.display = 'none'; return;
        }
        const a = ha.canvasPosition, b = hb.canvasPosition;
        l.style.display = ''; t.style.display = '';
        l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
        l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
        t.setAttribute('x', (a.x + b.x) / 2); t.setAttribute('y', (a.y + b.y) / 2 - 6);
      });
    }

    // ---------- main loop ----------
    let lastT = performance.now();
    function tick(t) {
      const dt = Math.min(0.1, (t - lastT) / 1000);
      lastT = t;
      if (mode === 'look') {
        if (lookS.x || lookS.y) {
          yawOff += lookS.x * LOOK_YAW * dt * Math.PI / 180;
          pitchOff = clamp(pitchOff + lookS.y * LOOK_PITCH * dt * Math.PI / 180, -1.2, 1.2);
          dirty = true;
        }
        let fwd = moveS.y * SPEED * dt, side = moveS.x * SPEED * dt;
        if (motionOn && pending > 0) { const s = Math.min(pending, WALK_RATE * dt); pending -= s; fwd += s; }
        if (fwd || side) {
          const hh = sensHH + yawOff + baseYaw;
          px += Math.sin(hh) * fwd + Math.cos(hh) * side;
          pz += -Math.cos(hh) * fwd + Math.sin(hh) * side;
          dirty = true;
        }
        if (dirty && ready) {
          computeView(); applyView(); dirty = false;
          if (DEBUG) toastEl.textContent = 'x ' + (px - cx).toFixed(2) + '  z ' + (pz - cz).toFixed(2) +
            '  yaw ' + Math.round(((view.hh * 180 / Math.PI) % 360 + 360) % 360), toastEl.classList.add('show');
        }
      }
      drawDims();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ---------- modes ----------
    function enterStage() {
      // The direction the visitor faces right now becomes the fixed start direction.
      mode = 'look';
      mv.removeAttribute('camera-controls');
      mv.fieldOfView = '65deg';
      offset = gotSensor ? lastHeading : null; sensHH = 0; sensP = gotSensor ? sensP : 0;
      goToSpot(); ready = true;
      computeView(); applyView(); dirty = true;
      $('sub').textContent = 'Stage view';
      b3d.classList.remove('on'); bMotion.classList.remove('dim'); $('b-joy').classList.remove('dim');
    }
    async function toOrbit() {
      mode = 'orbit';
      stopSensors();
      mv.setAttribute('camera-controls', '');
      mv.cameraTarget = 'auto auto auto';
      mv.cameraOrbit = '45deg 65deg auto';
      mv.fieldOfView = 'auto';
      mv.jumpCameraToGoal();
      $('sub').textContent = '3D view · drag to rotate, pinch to zoom';
      b3d.classList.add('on'); bMotion.classList.add('dim'); $('b-joy').classList.add('dim');
      $('jpanel').style.display = 'none'; $('b-joy').classList.remove('on');
    }
    async function toStage() {
      await startSensors();
      offset = null; gotSensor = false;       // next sensor reading sets the start direction
      mode = 'look';
      mv.removeAttribute('camera-controls');
      mv.fieldOfView = '65deg';
      sensHH = 0; sensP = 0; goToSpot(); ready = true;
      computeView(); applyView(); dirty = true;
      $('sub').textContent = 'Stage view';
      b3d.classList.remove('on'); bMotion.classList.remove('dim'); $('b-joy').classList.remove('dim');
    }

    b3d.addEventListener('click', () => { if (mode === 'look') toOrbit(); else toStage(); });
    $('b-reset').addEventListener('click', () => {
      if (mode === 'orbit') { toStage(); } else { enterStage(); }
      toast('View reset to the start point');
    });
    $('b-joy').addEventListener('click', () => {
      if (mode !== 'look') return;
      const open = $('jpanel').style.display !== 'flex';
      $('jpanel').style.display = open ? 'flex' : 'none';
      $('b-joy').classList.toggle('on', open);
    });
    bMotion.addEventListener('click', () => {
      if (mode !== 'look') return;
      motionOn = !motionOn; pending = 0;
      bMotion.classList.toggle('on', motionOn);
      toast(motionOn ? 'Motion on · walk to move through the stage' : 'Motion off · you look around from one point');
    });
    bMeas.addEventListener('click', () => {
      dimsOn = !dimsOn; bMeas.classList.toggle('on', dimsOn);
      $('mcard').style.display = dimsOn ? 'block' : 'none';
    });
    bAr.addEventListener('click', () => {
      if (mv.canActivateAR) mv.activateAR();
      else toast('AR is not supported on this phone or browser');
    });
    $('anim').addEventListener('click', () => {
      animOn = !animOn; if (animOn) mv.play(); else mv.pause();
      $('anim').textContent = 'Animation: ' + (animOn ? 'On' : 'Off');
    });

    // ---------- start-up ----------
    mv.addEventListener('progress', e => {
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      $('lfill').style.width = p + '%';
      $('ltxt').innerHTML = 'Loading ' + p + '%<br>Hold your phone upright, facing the QR code';
    });
    mv.addEventListener('load', () => {
      const c = mv.getBoundingBoxCenter(), d = mv.getDimensions();
      cx = c.x; cz = c.z; floorY = c.y - d.y / 2;
      buildDims();
      if (mv.availableAnimations && mv.availableAnimations.length > 0) $('anim').style.display = 'flex';
      $('loading').style.display = 'none';
      if (needsPerm) { $('start').style.display = 'flex'; }
      else { enterStage(); setTimeout(applyView, 300); }
    });
    customElements.whenDefined('model-viewer').then(() => {
      mv.removeAttribute('camera-controls');
      if (needsPerm) {
        $('b-start').addEventListener('click', async () => {
          await startSensors();
          setTimeout(() => { $('start').style.display = 'none'; enterStage(); }, 400);
        });
      } else { startSensors(); }
    });
  </script>
</body>
</html>
