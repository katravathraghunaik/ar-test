<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>A&M Mocap Lab · Virtual Stage</title>
  <link rel="icon" type="image/png" href="am-logo-small.png">
  <link rel="apple-touch-icon" href="am-logo.png">
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --red:#e11d2e; --red-soft:rgba(225,29,46,.24); --ink:#0b0b0c; --muted:#9b9da3;
            --glass:rgba(11,11,12,.68); --line:rgba(255,255,255,.10); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; overflow:hidden; touch-action:none; color:#f2f2f3;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(circle at 50% 30%, #c3c6ca 0%, #80848a 55%, #54585e 100%); }
    model-viewer { position:absolute; inset:0; width:100%; height:100%;
      background:transparent; --poster-color:transparent; }
    svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8;
            stroke-linecap:round; stroke-linejoin:round; }

    .glass { background:var(--glass); border:1px solid var(--line);
      -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
      box-shadow:0 10px 30px rgba(0,0,0,.32); }

    /* top bar */
    #top { position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px; right:12px;
      display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
    #brand { display:flex; align-items:center; gap:7px; padding:5px 10px 5px 8px; border-radius:14px;
      border-left:3px solid var(--red); pointer-events:auto; cursor:pointer; text-decoration:none; color:inherit; }
    #brand:active { background:rgba(225,29,46,.22); }
    #brand img { height:34px; width:auto; display:block; border-radius:3px; image-rendering:auto; }
    #brand .t { line-height:1.25; }
    #brand .t b { display:block; font-size:8.5px; letter-spacing:.16em; font-weight:700; }
    #brand .t span { font-size:8.5px; color:var(--muted); }
    #tr { display:flex; gap:8px; pointer-events:auto; }
    .tbtn { display:flex; align-items:center; justify-content:center; height:44px; border-radius:22px;
      color:var(--red); border:1.5px solid rgba(225,29,46,.7); background:rgba(11,11,12,.82); padding:0; }
    #pivotBtn { width:44px; }
    #pivotBtn svg.i { width:22px; height:22px; }
    #pivotBtn:active { background:var(--red); color:var(--ink); }
    #anim { display:none; height:44px; padding:0 14px; border-radius:22px; font-size:12px; font-weight:600;
      color:var(--red); border:1.5px solid rgba(225,29,46,.7); background:rgba(11,11,12,.82); margin-right:2px; }

    /* measurements */
    #mcard { position:absolute; top:calc(env(safe-area-inset-top,0px) + 70px); left:12px;
      padding:11px 14px 8px; border-radius:16px; font-size:12px; display:none; width:204px;
      border-left:3px solid var(--red); max-height:calc(100% - 210px); overflow:hidden; }
    #mcard h4 { margin:0; font-size:10px; letter-spacing:.18em; color:var(--red); font-weight:700;
      display:flex; justify-content:space-between; align-items:center; pointer-events:auto; }
    #mcard h4::after { content:'▾'; font-size:12px; }
    #mcard.shut h4::after { content:'▸'; }
    #mcard.shut #mbody { display:none; }
    #mcard .grp { margin:8px 0 2px; font-size:9.5px; letter-spacing:.14em; color:var(--muted); font-weight:700; }
    #mcard .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:2px 0;
      border-bottom:1px solid rgba(255,255,255,.06); font-variant-numeric:tabular-nums; }
    #mcard .row span { color:var(--muted); }
    #mcard .row b { font-weight:700; color:#f4f4f5; }
    #mcard .row b i { font-style:normal; font-weight:500; color:var(--muted); font-size:10.5px; margin-left:4px; }
    #dims { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
    #dims text { text-anchor:middle; font-family:inherit; }

    /* toast */
    #toast { position:absolute; left:50%; transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom,0px) + 98px); padding:9px 16px 9px 14px; border-radius:20px;
      font-size:13px; opacity:0; transition:opacity .35s; pointer-events:none; white-space:nowrap;
      display:flex; align-items:center; gap:8px; }
    #toast::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--red); }
    #toast.show { opacity:1; }

    /* joysticks */
    #jpanel { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
      display:none; justify-content:space-between; align-items:flex-end; padding:12px 16px 8px;
      border-radius:24px; touch-action:none; max-width:420px; margin:0 auto; }
    .jb { text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.16em; color:var(--muted); }
    .pad { position:relative; width:104px; height:104px; border-radius:50%; margin:0 auto 6px;
      background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.28); touch-action:none; }
    .pad::after { content:""; position:absolute; inset:34px; border-radius:50%;
      border:1px dashed rgba(255,255,255,.14); }
    .knob { position:absolute; left:30px; top:30px; width:44px; height:44px; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #ff4a58, var(--red) 55%, #9d0f1b);
      box-shadow:0 3px 10px rgba(0,0,0,.5); pointer-events:none; }
    .jmid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
      gap:5px; padding:0 6px 30px; min-width:0; text-align:center; }
    .jmid small { font-size:10px; letter-spacing:.18em; color:var(--red); font-weight:700; }
    #jvals { font-size:11.5px; color:#d9d9dc; line-height:1.5; font-variant-numeric:tabular-nums; }

    /* dock */
    #dock { position:absolute; left:50%; transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; gap:4px; padding:6px;
      border-radius:28px; width:calc(100% - 24px); max-width:420px; }
    #dock button { flex:1; border:0; background:transparent; color:#cfd0d3; border-radius:22px;
      padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
      font-size:10.5px; font-weight:600; letter-spacing:.02em; transition:background .2s, opacity .2s, color .2s; }
    #dock button svg.i { width:23px; height:23px; }
    #dock button.on { background:var(--red-soft); color:var(--red); }
    #dock button.dim { opacity:.35; }

    /* overlays */
    .ov { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
      justify-content:center; gap:18px; text-align:center; padding:28px; z-index:6;
      background:radial-gradient(circle at 50% 35%, #2a2a2d 0%, #111113 70%, #070708 100%); }
    .ov img { width:min(300px,78vw); height:auto; border-radius:6px; box-shadow:0 14px 40px rgba(0,0,0,.55); }
    .ov h1 { margin:0; font-size:13px; letter-spacing:.3em; font-weight:700; color:#e6e6e8; }
    .ov p { margin:0; font-size:14px; color:var(--muted); line-height:1.5; max-width:260px; }
    #loading { display:flex; z-index:7; }
    #lbar { width:200px; height:3px; border-radius:2px; background:rgba(255,255,255,.14); overflow:hidden; }
    #lfill { height:100%; width:0; background:var(--red); transition:width .25s; }
    #start button { padding:15px 38px; font-size:15px; font-weight:700; letter-spacing:.08em; border:0;
      border-radius:30px; background:var(--red); color:#fff; box-shadow:0 8px 24px rgba(225,29,46,.35); }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="Mocap_Truss_stage.glb?v=6"
    autoplay
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    min-camera-orbit="auto auto 0.1m"
    max-camera-orbit="auto auto 200m"
    shadow-intensity="0"
    interaction-prompt="none"
    field-of-view="65deg"
    min-field-of-view="30deg"
    max-field-of-view="120deg"
    alt="Mocap stage truss">
    <div slot="progress-bar"></div>
  </model-viewer>

  <svg id="dims"></svg>

  <div id="top">
    <a id="brand" class="glass" href="https://www.annapurnastudios.com/a-m-mocaplab.html" target="_blank" rel="noopener" aria-label="A&M Mocap Lab website">
      <img data-logo alt="A&M Mocap Lab">
      <div class="t"><b>VIRTUAL STAGE</b><span id="sub">Stage view</span></div>
    </a>
    <div id="tr">
      <button id="anim" class="glass">Animation: On</button>
      <button id="pivotBtn" class="tbtn" aria-label="Go to origin">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4.2M12 17.3v4.2M2.5 12h4.2M17.3 12h4.2"/></svg>
      </button>
    </div>
  </div>

  <div id="mcard" class="glass"><h4 id="mhead">TRUSS DIMENSIONS</h4><div id="mbody"></div></div>

  <div id="toast" class="glass"></div>

  <div id="jpanel" class="glass">
    <div class="jb"><div class="pad" id="padMove"><div class="knob" id="knMove"></div></div>MOVE</div>
    <div class="jmid"><small>POSITION</small><div id="jvals"></div></div>
    <div class="jb"><div class="pad" id="padLook"><div class="knob" id="knLook"></div></div>LOOK</div>
  </div>

  <div id="dock" class="glass">
    <button id="b-meas">
      <svg class="i" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>
      Measure
    </button>
    <button id="b-3d">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M12 12l8.5-4.7M12 12v9.5M12 12L3.5 7.3"/></svg>
      3D View
    </button>
    <button id="b-joy">
      <svg class="i" viewBox="0 0 24 24"><path d="M6.5 8h11a4.5 4.5 0 014.4 5.5l-.7 3a2.6 2.6 0 01-4.4 1.2L15 15.5H9l-1.8 2.2a2.6 2.6 0 01-4.4-1.2l-.7-3A4.5 4.5 0 016.5 8z"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="15.5" cy="11" r=".6" fill="currentColor"/><circle cx="17.5" cy="13" r=".6" fill="currentColor"/></svg>
      Joystick
    </button>
    <button id="b-motion">
      <svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2.2-6-2.7-2.5 1.2-4.2 3.5 1.2 2.6 2.8M11.2 15l3.8 1.5 1 4.5M7 9.5l3.7-2"/></svg>
      Motion
    </button>
    <button id="b-ar">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16"/><path d="M12 8l3.5 2v4L12 16l-3.5-2v-4z"/></svg>
      AR
    </button>
  </div>

  <div id="start" class="ov">
    <img data-logo alt="A&M Mocap Lab">
    <p>Stand on the marked spot and face the QR code.</p>
    <button id="b-start">ENTER</button>
  </div>

  <div id="loading" class="ov">
    <img data-logo alt="A&M Mocap Lab">
    <h1>VIRTUAL STAGE</h1>
    <div id="lbar"><div id="lfill"></div></div>
    <p id="ltxt">Loading 0%<br>Hold your phone upright, facing the QR code</p>
  </div>

  <script>
    const LOGO = 'am-logo.png?v=7';   // high-quality A&M Mocap Lab logo (file in the same folder)
    document.querySelectorAll('img[data-logo]').forEach(i => { i.src = LOGO; });

    // ===== START POINT =====
    // x, z = metres from the CENTRE of the stage (the green square on the floor).
    // 0, 0 = standing in the middle of the grid. The origin button (top right) takes you back to this same point
    // (the button never changes it).
    // yaw = direction faced at the start: 0 = toward -z, 90 = toward +x, 180 = toward +z, 270 = toward -x.
    const SPOT = { x: 0, z: 0, yaw: 90 };   // origin faces +x (turned 90°); use 270 for the opposite way
    // ========================

    // ===== TRUSS SIZE (metres, measured from the model; used by Measure) =====
    const STAGE = { w: 24.382, d: 14.326, h: 11.536 };      // real truss size in the model (used only to place the lines on the truss)
    const REAL  = { w: 18.288, d: 12.192, h: 9.144 };       // usable stage: 60 ft wide, 40 ft deep, 30 ft high (the numbers shown)

    // ===== SETTINGS =====
    const EYE = 1.6;          // eye height above the floor, metres
    const SMOOTH = 0.14;      // look smoothing: lower = steadier, higher = quicker
    const DEADZONE = 0.22;    // degrees of tiny movement ignored (removes shake)
    const SHOW_VALUES = true; // show x, z and direction
    const SPEED = 1.5;        // joystick walking speed, metres per second
    const LOOK_YAW = 70;      // look joystick turn speed, degrees per second
    const LOOK_PITCH = 45;    // look joystick up/down speed
    const STEP_LEN = 0.75;    // metres moved per detected step (Motion button)
    const STEP_THRESH = 0.7;  // lower = more sensitive step detection
    const WALK_RATE = 3;      // how quickly a step is applied, metres per second
    const R = 1;              // keep as is
    const FOV_START = 65;     // starting field of view in degrees (higher = wider)
    const FOV_MIN = 30, FOV_MAX = 110;   // pinch limits
    // ====================

    // Testing only: change the start from the link, e.g.  ?x=-8&z=9&yaw=270
    const qs = new URLSearchParams(location.search);
    ['x', 'z', 'yaw'].forEach(k => { const v = parseFloat(qs.get(k)); if (!isNaN(v)) SPOT[k] = v; });
    const baseYaw = SPOT.yaw * Math.PI / 180;

    const $ = id => document.getElementById(id);
    const mv = $('mv'), svg = $('dims'), toastEl = $('toast');
    const bMeas = $('b-meas'), bMotion = $('b-motion'), bJoy = $('b-joy'), b3d = $('b-3d'), bAr = $('b-ar');
    const NS = 'http://www.w3.org/2000/svg';
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    // True while an AR session is running. The pinch zoom only changes the stage-view camera, so it must be
    // completely off in AR (the camera video can't be zoomed, and the stage is fixed to real-world size).
    const inAR = () => mv.arStatus === 'session-started' || mv.arStatus === 'object-placed';
    const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
    const m2 = v => v.toFixed(2) + ' m  ·  ' + (v * 3.28084).toFixed(1) + ' ft';

    let cx = 0, cz = 0, floorY = 0;
    const eyeY = () => floorY + EYE;

    let fov = FOV_START;                     // current field of view (pinch changes it)
    let mode = 'look';                       // 'look' or 'orbit'
    let px = 0, pz = 0;
    let view = { dx:0, dy:0, dz:-1, theta:0, phi:90, hh:0 };
    let sensHH = 0, sensP = 0, offset = null, lastHeading = 0, gotSensor = false;
    let yawOff = 0, pitchOff = 0, dirty = true, listening = false, ready = false;
    let motionOn = false, dimsOn = false, animOn = true;
    let pending = 0, lastStep = 0, base = 9.8, prevHp = 0, freezeUntil = 0;

    const needsPerm = typeof DeviceOrientationEvent !== 'undefined' &&
                      typeof DeviceOrientationEvent.requestPermission === 'function';
    // Gyro-based orientation (not the compass): steadier, and not disturbed by the magnets in flip/fold phones.
    const evName = 'deviceorientation';

    // Hold the view steady for a moment whenever the screen is touched (the phone wobbles slightly).
    ['pointerdown', 'pointerup', 'touchstart', 'touchend'].forEach(t =>
      window.addEventListener(t, () => { freezeUntil = performance.now() + 400; }, true));

    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    // ---------- camera ----------
    function curYaw() { return ((view.hh * 180 / Math.PI) % 360 + 360) % 360; }
    function computeView() {
      const hh = sensHH + yawOff + baseYaw;
      const p = clamp(sensP + pitchOff, -1.3, 1.3);
      view.hh = hh;
      view.dx = Math.cos(p) * Math.sin(hh);
      view.dy = Math.sin(p);
      view.dz = -Math.cos(p) * Math.cos(hh);
      view.theta = Math.atan2(-view.dx, -view.dz) * 180 / Math.PI;
      view.phi = Math.acos(-view.dy) * 180 / Math.PI;
    }
    function applyView() {
      if (typeof mv.jumpCameraToGoal !== 'function') return;
      mv.cameraTarget = `${px + view.dx*R}m ${eyeY() + view.dy*R}m ${pz + view.dz*R}m`;
      mv.cameraOrbit = `${view.theta}deg ${view.phi}deg ${R}m`;
      mv.jumpCameraToGoal();
    }
    function goToSpot() {                    // start point = the origin (stage centre)
      px = cx + SPOT.x; pz = cz + SPOT.z; pending = 0; pitchOff = 0; dirty = true;
      yawOff = 0;
    }

    // ---------- sensors ----------
    function dirFromEuler(a, b, gm) {
      const d = Math.PI / 180; a *= d; b *= d; gm *= d;
      const x = -Math.sin(gm)*Math.cos(a) - Math.sin(b)*Math.cos(gm)*Math.sin(a);
      const y = -Math.sin(gm)*Math.sin(a) + Math.sin(b)*Math.cos(gm)*Math.cos(a);
      const z = -Math.cos(b)*Math.cos(gm);
      return { X: x, Y: z, Z: -y };
    }
    function onOrient(e) {
      if (e.alpha === null || e.alpha === undefined) return;
      const v = dirFromEuler(e.alpha, e.beta, e.gamma);
      const p = Math.asin(clamp(v.Y, -1, 1));
      const flat = Math.abs(v.Y) > 0.97;                 // looking straight up/down: heading is unreliable
      const h = Math.atan2(v.X, -v.Z);
      gotSensor = true;
      if (!flat) lastHeading = h;
      if (offset === null) {                              // first reading sets "straight ahead"
        if (flat) return;
        offset = h; sensHH = 0; sensP = p; dirty = true; return;
      }
      if (performance.now() < freezeUntil) return;        // finger on the screen: hold steady
      const dh = flat ? 0 : wrap(wrap(h - offset) - sensHH), dp = p - sensP;
      const mag = Math.hypot(dh, dp) * 180 / Math.PI;
      if (mag < DEADZONE) return;                         // ignore tiny shake
      const a = clamp(SMOOTH + mag * 0.12, SMOOTH, 1);    // small moves are smoothed, big turns follow quickly
      sensHH = wrap(sensHH + dh * a); sensP += dp * a; dirty = true;
    }
    function onStep(e) {
      if (mode !== 'look' || !ready || !motionOn) return;
      const a = e.accelerationIncludingGravity;
      if (!a || a.x === null || a.x === undefined) return;
      const m = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
      base = base * 0.98 + m * 0.02;
      const hp = m - base;
      const now = performance.now();
      if (hp > STEP_THRESH && prevHp <= STEP_THRESH && now - lastStep > 300) {
        lastStep = now; pending = Math.min(pending + STEP_LEN, 3);
      }
      prevHp = hp;
    }
    async function startSensors() {
      try {
        if (needsPerm) {
          await DeviceOrientationEvent.requestPermission();
          if (typeof DeviceMotionEvent !== 'undefined' &&
              typeof DeviceMotionEvent.requestPermission === 'function') {
            await DeviceMotionEvent.requestPermission();
          }
        }
      } catch (err) {}
      if (!listening) {
        window.addEventListener(evName, onOrient, true);
        window.addEventListener('devicemotion', onStep, true);
        listening = true;
      }
    }
    function stopSensors() {
      window.removeEventListener(evName, onOrient, true);
      window.removeEventListener('devicemotion', onStep, true);
      listening = false;
    }

    // ---------- joysticks ----------
    function makeJoy(pad, knob, state) {
      const MAXR = 30; let id = null;
      function move(e) {
        const r = pad.getBoundingClientRect();
        let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
        const l = Math.hypot(x, y);
        if (l > MAXR) { x = x / l * MAXR; y = y / l * MAXR; }
        knob.style.transform = `translate(${x}px,${y}px)`;
        state.x = x / MAXR; state.y = -y / MAXR;
      }
      function end() { id = null; state.x = 0; state.y = 0; knob.style.transform = 'translate(0,0)'; }
      pad.addEventListener('pointerdown', e => { id = e.pointerId; pad.setPointerCapture(id); move(e); e.preventDefault(); });
      pad.addEventListener('pointermove', e => { if (e.pointerId === id) move(e); });
      pad.addEventListener('pointerup', end);
      pad.addEventListener('pointercancel', end);
    }
    const moveS = { x:0, y:0 }, lookS = { x:0, y:0 };
    makeJoy($('padMove'), $('knMove'), moveS);
    makeJoy($('padLook'), $('knLook'), lookS);

    // ---------- measurements: dimension lines drawn on the truss ----------
    // 3D view: one fixed, one-sided set (front width, left depth, front-left pole).
    // Stage view: the lines are picked from the direction you are looking, so they always sit in front of you.
    const HW = STAGE.w / 2, HD = STAGE.d / 2, OFF = 0.45;
    const DIMS = [
      { name:'Width',  a:[-HW, 0.05, HD + OFF],       b:[HW, 0.05, HD + OFF] },            // 0 front wall
      { name:'Width',  a:[-HW, 0.05, -HD - OFF],      b:[HW, 0.05, -HD - OFF] },           // 1 back wall
      { name:'Depth',  a:[-HW - OFF, 0.05, -HD],      b:[-HW - OFF, 0.05, HD] },           // 2 left wall
      { name:'Depth',  a:[HW + OFF, 0.05, -HD],       b:[HW + OFF, 0.05, HD] },            // 3 right wall
      { name:'Height', a:[-HW - OFF, 0, HD + OFF],    b:[-HW - OFF, STAGE.h, HD + OFF] },  // 4 front-left pole
      { name:'Height', a:[HW + OFF, 0, HD + OFF],     b:[HW + OFF, STAGE.h, HD + OFF] },   // 5 front-right pole
      { name:'Height', a:[-HW - OFF, 0, -HD - OFF],   b:[-HW - OFF, STAGE.h, -HD - OFF] }, // 6 back-left pole
      { name:'Height', a:[HW + OFF, 0, -HD - OFF],    b:[HW + OFF, STAGE.h, -HD - OFF] }   // 7 back-right pole
    ];
    const ORBIT_SET = [0, 2, 4];
    DIMS.forEach(d => { d.len = d.name === 'Width' ? REAL.w : d.name === 'Depth' ? REAL.d : REAL.h; });   // shown numbers = your exact measurements
    const fmtM = v => v.toFixed(2) + ' m', fmtF = v => (v * 3.28084).toFixed(1) + ' ft';
    (function buildCard() {
      const row = (l, v) => `<div class="row"><span>${l}</span><b>${fmtM(v)}</b></div>`;
      $('mbody').innerHTML = row('Width', REAL.w) + row('Height', REAL.h) + row('Depth', REAL.d);
      $('mhead').addEventListener('click', () => $('mcard').classList.toggle('shut'));
    })();

    let dimEls = [], dimsBuilt = false;
    const abs3 = p => [cx + p[0], floorY + p[1], cz + p[2]];
    function buildDims() {
      mv.querySelectorAll('.hs').forEach(n => n.remove());
      svg.innerHTML = ''; dimEls = [];
      DIMS.forEach((d, i) => {
        ['a', 'b'].forEach(k => {
          const b = document.createElement('button');
          b.className = 'hs'; b.slot = 'hotspot-d' + i + k;
          b.setAttribute('data-position', abs3(d[k]).map(v => v + 'm').join(' '));
          b.setAttribute('data-normal', '0 1 0');
          b.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;';
          mv.appendChild(b);
        });
        const g = document.createElementNS(NS, 'g');
        const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); return e; };
        const under = mk('line', { stroke:'rgba(0,0,0,.75)', 'stroke-width':'6', 'stroke-linecap':'round' });
        const line  = mk('line', { stroke:'#e11d2e', 'stroke-width':'3', 'stroke-linecap':'round' });
        const ah1 = mk('polygon', { fill:'#e11d2e', stroke:'rgba(0,0,0,.75)', 'stroke-width':'1.2' });
        const ah2 = mk('polygon', { fill:'#e11d2e', stroke:'rgba(0,0,0,.75)', 'stroke-width':'1.2' });
        const pill = mk('rect', { width:'112', height:'36', rx:'10', fill:'rgba(11,11,12,.9)', stroke:'#e11d2e', 'stroke-width':'1.6' });
        const t1 = mk('text', { fill:'#ffffff', 'font-size':'13', 'font-weight':'700' }); t1.textContent = fmtM(d.len);
        const t2 = mk('text', { fill:'#b9bbc0', 'font-size':'10.5', 'font-weight':'500' }); t2.textContent = d.name + ' · ' + fmtF(d.len);
        svg.appendChild(g); g.style.display = 'none'; dimEls.push({ g, under, line, ah1, ah2, pill, t1, t2 });
      });
      dimsBuilt = true;
    }
    function setDims(on) {
      dimsOn = on;
      if (on && !dimsBuilt) buildDims();
      if (!on) { mv.querySelectorAll('.hs').forEach(n => n.remove()); svg.innerHTML = ''; dimEls = []; dimsBuilt = false; }
    }
    function arrow(x, y, ux, uy) {            // arrow head at (x,y) pointing along (ux,uy)
      const s = 11, w = 5, bx = x - ux * s, by = y - uy * s;
      return `${x},${y} ${bx - uy * w},${by + ux * w} ${bx + uy * w},${by - ux * w}`;
    }
    function inFront(p) {
      if (mode !== 'look') return true;
      return (p[0]-px)*view.dx + (p[1]-eyeY())*view.dy + (p[2]-pz)*view.dz > 0.2;
    }
    // which lines to draw right now
    function activeDims() {
      if (mode !== 'look') return ORBIT_SET;                       // 3D view: fixed, one-sided
      const hl = Math.hypot(view.dx, view.dz) || 1, vx = view.dx / hl, vz = view.dz / hl;
      const seen = i => inFront(abs3(DIMS[i].a)) && inFront(abs3(DIMS[i].b));
      const score = i => {                                         // how centred it is in the direction you look
        const d = DIMS[i], mx = cx + (d.a[0] + d.b[0]) / 2 - px, mz = cz + (d.a[2] + d.b[2]) / 2 - pz;
        return (mx * vx + mz * vz) / (Math.hypot(mx, mz) || 1);
      };
      const best = list => list.filter(seen).sort((p, q) => score(q) - score(p))[0];
      return [best([0, 1]), best([2, 3]), best([4, 5, 6, 7])].filter(i => i !== undefined);
    }
    function drawDims() {
      if (!dimsOn || !dimsBuilt) { svg.style.display = 'none'; return; }
      svg.style.display = 'block';
      const act = activeDims(), W = svg.clientWidth || innerWidth, H = svg.clientHeight || innerHeight;
      dimEls.forEach((e, i) => { if (!act.includes(i)) e.g.style.display = 'none'; });
      act.forEach(i => {
        const d = DIMS[i], e = dimEls[i];
        const ha = mv.queryHotspot('hotspot-d' + i + 'a'), hb = mv.queryHotspot('hotspot-d' + i + 'b');
        let show = !!(ha && hb), a, b, L = 0;
        if (show) { a = ha.canvasPosition; b = hb.canvasPosition; L = Math.hypot(b.x - a.x, b.y - a.y); show = L > 44; }
        if (!show) { e.g.style.display = 'none'; return; }
        e.g.style.display = '';
        const ux = (b.x - a.x) / L, uy = (b.y - a.y) / L;
        for (const el of [e.under, e.line]) {
          el.setAttribute('x1', a.x + ux * 6); el.setAttribute('y1', a.y + uy * 6);
          el.setAttribute('x2', b.x - ux * 6); el.setAttribute('y2', b.y - uy * 6);
        }
        e.ah1.setAttribute('points', arrow(a.x, a.y, -ux, -uy));
        e.ah2.setAttribute('points', arrow(b.x, b.y, ux, uy));
        const mx = clamp((a.x + b.x) / 2, 62, W - 62), my = clamp((a.y + b.y) / 2, 90, H - 190);   // keep the label on screen
        e.pill.setAttribute('x', mx - 56); e.pill.setAttribute('y', my - 18);
        e.t1.setAttribute('x', mx); e.t1.setAttribute('y', my - 2);
        e.t2.setAttribute('x', mx); e.t2.setAttribute('y', my + 12);
      });
    }

    // ---------- origin ----------
    // The origin is always the stage centre (SPOT). The button only takes you back there; it never changes it.
    try { localStorage.removeItem('stagePivot'); } catch (e) {}      // forget any pivot saved by the earlier version
    const valText = (x, z, yaw) => 'x ' + x.toFixed(2) + ' · z ' + z.toFixed(2) + ' · ' + Math.round(yaw) + '°';
    function updateVals() {
      const t = valText(px - cx, pz - cz, curYaw());
      if (SHOW_VALUES) $('jvals').innerHTML = t.replace(/ · /g, '<br>');
    }
    $('pivotBtn').addEventListener('click', async e => {
      e.stopPropagation();
      if (mode === 'orbit') await toStage();                          // 3D view -> stage view, at the origin
      else { px = cx + SPOT.x; pz = cz + SPOT.z; pending = 0; dirty = true; }
      toast('Back at the origin');
    });

    // ---------- camera lights: slow red <-> blue blink ----------
    const LED_RED = [0.90, 0.05, 0.07], LED_BLUE = [0.05, 0.25, 1.0];
    const LED_PERIOD = 6;                    // seconds for one full red -> blue -> red cycle (higher = slower)
    let ledMat = null, ledLast = 0;
    function ledInit() {
      const mats = (mv.model && mv.model.materials) || [];
      ledMat = mats.find(m => m.name === 'Cam_LED_Red') || null;
    }
    function ledTick(t) {
      if (!ledMat || t - ledLast < 70) return;            // ~14 updates a second is plenty for a slow fade
      ledLast = t;
      const k = (1 - Math.cos(2 * Math.PI * t / 1000 / LED_PERIOD)) / 2;   // smooth 0 -> 1 -> 0
      const c = LED_RED.map((r, i) => r + (LED_BLUE[i] - r) * k);
      ledMat.pbrMetallicRoughness.setBaseColorFactor([c[0], c[1], c[2], 1]);
      ledMat.setEmissiveFactor(c);
    }

    // ---------- main loop ----------
    let lastT = performance.now();
    function tick(t) {
      const dt = Math.min(0.1, (t - lastT) / 1000);
      lastT = t;
      if (mode === 'look') {
        if (lookS.x || lookS.y) {
          yawOff += lookS.x * LOOK_YAW * dt * Math.PI / 180;
          pitchOff = clamp(pitchOff + lookS.y * LOOK_PITCH * dt * Math.PI / 180, -1.2, 1.2);
          dirty = true;
        }
        let fwd = moveS.y * SPEED * dt, side = moveS.x * SPEED * dt;
        if (motionOn && pending > 0) { const s = Math.min(pending, WALK_RATE * dt); pending -= s; fwd += s; }
        if (fwd || side) {
          const hh = sensHH + yawOff + baseYaw;
          px += Math.sin(hh) * fwd + Math.cos(hh) * side;
          pz += -Math.cos(hh) * fwd + Math.sin(hh) * side;
          dirty = true;
        }
        if (dirty && ready && !arActive) { computeView(); applyView(); dirty = false; updateVals(); }
      }
      drawDims();
      ledTick(t);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);


    // ---------- pinch to zoom (stage view): pinch in = wider, pinch out = zoom in ----------
    (function () {
      let d0 = 0, f0 = fov, tt = 0, lastFov = fov;
      const ctlSym = () => Object.getOwnPropertySymbols(mv).find(k => k.description === 'controls');
      function setFov(v) {
        const prev = lastFov; lastFov = fov = clamp(v, FOV_MIN, FOV_MAX);
        const before = typeof mv.getFieldOfView === 'function' ? mv.getFieldOfView() : 0;
        mv.fieldOfView = fov.toFixed(1) + 'deg';
        const kick = () => { if (typeof mv.jumpCameraToGoal === 'function') mv.jumpCameraToGoal(); dirty = true; };
        kick();
        if (mv.updateComplete) mv.updateComplete.then(kick);
        setTimeout(kick, 60);
        setTimeout(() => {                    // if the viewer ignored the property, move its camera directly
          try {
            const now = mv.getFieldOfView();
            if (before && Math.abs(now - before) < 0.05 && Math.abs(fov - prev) > 0.05) {
              const c = mv[ctlSym()];
              c.setFieldOfView(before * fov / prev); c.jumpToGoal(); kick();
            }
          } catch (e) {}
        }, 140);
        toast('View ' + Math.round(fov) + '°' + (fov <= FOV_MIN + 0.5 ? ' (max zoom)' : fov >= FOV_MAX - 0.5 ? ' (widest)' : ''));
      }
      const start = d => { d0 = d; f0 = fov; };
      const move = d => {
        if (mode !== 'look' || !d0 || inAR()) return;
        const now = performance.now(); if (now - tt < 30) return; tt = now;
        setFov(f0 * d0 / Math.max(d, 1));              // fingers apart -> smaller angle -> zoom in
      };
      const onUI = el => !!(el && el.closest && el.closest('#jpanel,#dock,#top,#mcard'));
      const td = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      // touch events
      document.addEventListener('touchstart', e => {
        if (inAR()) { d0 = 0; return; }
        if (e.touches.length === 2 && !onUI(e.touches[0].target) && !onUI(e.touches[1].target)) start(td(e.touches)); else if (e.touches.length !== 2) d0 = 0;
      }, { capture: true, passive: true });
      document.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && d0 && !inAR()) { move(td(e.touches)); e.preventDefault(); }
      }, { capture: true, passive: false });
      document.addEventListener('touchend', e => { if (e.touches.length < 2) d0 = 0; }, { capture: true, passive: true });
      document.addEventListener('touchcancel', () => { d0 = 0; }, { capture: true, passive: true });
      // pointer events (same maths, in case touch events are not delivered)
      const pts = new Map();
      const pd = () => { const p = [...pts.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
      document.addEventListener('pointerdown', e => {
        if (onUI(e.target) || inAR()) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2) start(pd());
      }, true);
      document.addEventListener('pointermove', e => {
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2) move(pd());
      }, true);
      const up = e => { pts.delete(e.pointerId); if (pts.size < 2) d0 = 0; };
      document.addEventListener('pointerup', up, true);
      document.addEventListener('pointercancel', up, true);
      // iOS Safari pinch gesture
      let g0 = fov;
      document.addEventListener('gesturestart', e => { if (inAR()) return; e.preventDefault(); g0 = fov; }, true);
      document.addEventListener('gesturechange', e => {
        if (inAR()) return;
        e.preventDefault();
        if (mode === 'look') setFov(g0 / Math.max(e.scale, 0.05));
      }, true);
      // desktop testing: scroll wheel
      window.addEventListener('wheel', e => { if (mode === 'look' && !inAR()) setFov(fov * (e.deltaY > 0 ? 1.06 : 0.94)); }, { passive: true });
    })();

    // ---------- modes ----------
    function enterStage() {
      // The direction the visitor faces right now becomes the fixed start direction.
      mode = 'look';
      mv.removeAttribute('camera-controls');
      mv.fieldOfView = fov + 'deg';
      offset = gotSensor ? lastHeading : null; sensHH = 0; if (!gotSensor) sensP = 0;
      goToSpot(); ready = true;
      computeView(); applyView(); dirty = true;
      $('sub').textContent = 'Stage view';
      b3d.classList.remove('on'); bMotion.classList.remove('dim'); bJoy.classList.remove('dim');
    }
    function toOrbit() {
      mode = 'orbit';
      stopSensors();
      $('jpanel').style.display = 'none'; bJoy.classList.remove('on');
      mv.setAttribute('camera-controls', '');
      mv.cameraTarget = 'auto auto auto';
      mv.cameraOrbit = '45deg 65deg auto';
      mv.fieldOfView = 'auto';
      mv.jumpCameraToGoal();
      $('sub').textContent = '3D view · drag to rotate';
      b3d.classList.add('on'); bMotion.classList.add('dim'); bJoy.classList.add('dim');
    }
    async function toStage() {
      await startSensors();
      offset = null; gotSensor = false;       // next sensor reading sets the start direction
      mode = 'look';
      mv.removeAttribute('camera-controls');
      mv.fieldOfView = fov + 'deg';
      sensHH = 0; sensP = 0; goToSpot(); ready = true;
      computeView(); applyView(); dirty = true;
      $('sub').textContent = 'Stage view';
      b3d.classList.remove('on'); bMotion.classList.remove('dim'); bJoy.classList.remove('dim');
    }

    b3d.addEventListener('click', () => { if (mode === 'look') toOrbit(); else toStage(); });
    bJoy.addEventListener('click', () => {
      if (mode !== 'look') return;
      const open = $('jpanel').style.display !== 'flex';
      $('jpanel').style.display = open ? 'flex' : 'none';
      bJoy.classList.toggle('on', open);
    });
    bMotion.addEventListener('click', () => {
      if (mode !== 'look') return;
      motionOn = !motionOn; pending = 0;
      bMotion.classList.toggle('on', motionOn);
      toast(motionOn ? 'Motion on · walk to move through the stage' : 'Motion off · look around from one point');
    });
    bMeas.addEventListener('click', () => {
      setDims(!dimsOn); bMeas.classList.toggle('on', dimsOn);
      $('mcard').style.display = dimsOn ? 'block' : 'none';
    });
    // AR: the stage stands directly on the real floor, like in VR (the model's floor is at height 0).
    // The stage-view camera sits at eye height (1.6 m) inside the stage; if that camera target is still active when
    // AR starts, the whole stage is placed that much too high. So everything is reset to the plain model view first.
    let arActive = false;
    const nextFrames = n => new Promise(r => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
    bAr.addEventListener('click', async () => {
      if (!mv.canActivateAR) { toast('AR is not supported on this phone or browser'); return; }
      arActive = true;                                // stops the stage-view camera from being applied
      mv.removeAttribute('camera-controls');
      mv.fieldOfView = 'auto';                        // AR uses the phone camera's own field of view
      mv.cameraTarget = 'auto auto auto';             // model centre, NOT the eye-height point from stage view
      mv.cameraOrbit = '0deg 75deg auto';
      mv.jumpCameraToGoal();
      if (!needsPerm) await nextFrames(2);            // let the viewer apply it before AR reads the placement (Android)
      mv.activateAR();
    });
    mv.addEventListener('ar-status', e => {
      const st = e.detail && e.detail.status;
      if (st === 'session-started') toast('Move your phone slowly to scan the floor, then tap to place · pinch is off in AR');
      else if (st === 'object-placed') toast('Stage placed. Walk around slowly for best tracking');
      else if (st === 'failed') { arActive = false; toast('AR could not start. Check camera permission and lighting'); }
      else if (st === 'not-presenting') {
        arActive = false;
        if (mode === 'look') { mv.fieldOfView = fov.toFixed(1) + 'deg'; computeView(); applyView(); dirty = true; }
      }
    });
    $('anim').addEventListener('click', () => {
      animOn = !animOn; if (animOn) mv.play(); else mv.pause();
      $('anim').textContent = 'Animation: ' + (animOn ? 'On' : 'Off');
    });

    // ---------- start-up ----------
    mv.addEventListener('progress', e => {
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      $('lfill').style.width = p + '%';
      $('ltxt').innerHTML = 'Loading ' + p + '%<br>Hold your phone upright, facing the QR code';
    });
    mv.addEventListener('load', () => {
      const c = mv.getBoundingBoxCenter(), d = mv.getDimensions();
      cx = c.x; cz = c.z; floorY = c.y - d.y / 2;
      ledInit();
      if (mv.availableAnimations && mv.availableAnimations.length > 0) $('anim').style.display = 'block';
      $('loading').style.display = 'none';
      if (needsPerm) { $('start').style.display = 'flex'; }
      else { enterStage(); setTimeout(applyView, 300); }
    });
    customElements.whenDefined('model-viewer').then(() => {
      mv.removeAttribute('camera-controls');
      if (needsPerm) {
        $('b-start').addEventListener('click', async () => {
          await startSensors();
          setTimeout(() => { $('start').style.display = 'none'; enterStage(); }, 400);
        });
      } else { startSensors(); }
    });
  </script>
</body>
</html>
