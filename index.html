<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mocap Stage Truss</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#8a8a8a; font-family:sans-serif;
                 overflow:hidden; touch-action:none; }
    model-viewer { width:100%; height:100%; background:#8a8a8a; --poster-color:#8a8a8a; }
    #dims { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
    #dims text { font-size:13px; font-weight:bold; paint-order:stroke; stroke:#fff; stroke-width:4px;
                 stroke-linejoin:round; text-anchor:middle; }
    #bar { position:absolute; bottom:14px; left:0; right:0; display:flex; gap:5px;
           justify-content:center; padding:0 5px; }
    #bar button { flex:1; max-width:82px; padding:11px 2px; font-size:12px; border:0;
                  border-radius:22px; background:#444; color:#fff; }
    #bar button.active { background:#1a73e8; }
    #note { position:absolute; top:8px; width:100%; text-align:center; font-size:12px;
            color:#222; pointer-events:none; }
    #anim { position:absolute; top:30px; right:8px; display:none; padding:8px 12px; font-size:12px;
            border:0; border-radius:16px; background:#444; color:#fff; }
    #panel { position:absolute; left:8px; right:8px; bottom:68px; display:none; gap:6px;
             background:rgba(0,0,0,.4); border-radius:16px; padding:10px 6px;
             justify-content:space-around; align-items:flex-end; touch-action:none; }
    .pb { text-align:center; color:#fff; font-size:12px; }
    .pad { position:relative; width:96px; height:96px; border-radius:50%; margin:0 auto 4px;
           background:rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.7); touch-action:none; }
    .knob { position:absolute; left:26px; top:26px; width:44px; height:44px; border-radius:50%;
            background:rgba(255,255,255,.9); box-shadow:0 1px 5px rgba(0,0,0,.4); pointer-events:none; }
    .mid { display:flex; flex-direction:column; gap:8px; }
    .mid button { padding:10px 8px; font-size:12px; border:0; border-radius:16px;
                  background:#555; color:#fff; }
    .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
               text-align:center; color:#fff; padding:24px; box-sizing:border-box; }
    #loading { background:#8a8a8a; display:flex; flex-direction:column; gap:14px; font-size:16px; }
    #lbar { width:220px; height:8px; border-radius:4px; background:rgba(255,255,255,.35); overflow:hidden; }
    #lfill { height:100%; width:0; background:#fff; transition:width .2s; }
    #start { background:rgba(50,50,50,.9); flex-direction:column; gap:18px; }
    #start button { padding:16px 30px; font-size:18px; border:0; border-radius:30px;
                    background:#1a73e8; color:#fff; }
    #cd { pointer-events:none; }
    #cd .card { background:rgba(0,0,0,.6); padding:22px 26px; border-radius:20px; }
    #cd .big { font-size:54px; font-weight:bold; line-height:1.1; }
    #cd .sm { font-size:16px; margin-top:8px; }
    #setup { position:absolute; top:56px; left:8px; display:none; background:rgba(255,255,255,.95);
             color:#111; border-radius:12px; padding:8px 10px; font-size:13px; max-width:260px; }
    #setup button { margin-top:6px; padding:8px 12px; border:0; border-radius:12px;
                    background:#1a73e8; color:#fff; font-size:13px; }
    #setup code { display:block; margin-top:6px; word-break:break-all; user-select:all; }
  </style>
</head>
<body>
  <div id="note"></div>

  <model-viewer id="mv"
    src="Mocap_Truss_web.glb"
    autoplay
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    min-camera-orbit="auto auto 0.1m"
    max-camera-orbit="auto auto 200m"
    interaction-prompt="none"
    field-of-view="65deg"
    alt="Mocap stage truss">
    <div slot="progress-bar"></div>
  </model-viewer>

  <svg id="dims"></svg>
  <button id="anim">Animation: On</button>

  <div id="setup">
    <b>Setup mode</b><br>
    <span id="setxt"></span>
    <button id="b-save">Save this spot</button>
    <code id="saved"></code>
  </div>

  <div id="panel">
    <div class="pb"><div class="pad" id="padMove"><div class="knob" id="knMove"></div></div>Move</div>
    <div class="mid">
      <button id="b-fwd">Set Forward</button>
    </div>
    <div class="pb"><div class="pad" id="padLook"><div class="knob" id="knLook"></div></div>Look</div>
  </div>

  <div id="bar">
    <button id="b-pivot" class="active">Pivot View</button>
    <button id="b-ctrl">Controls</button>
    <button id="b-meas">Measure</button>
    <button id="b-3d">3D Model</button>
    <button id="b-ar">View in AR</button>
  </div>

  <div id="cd" class="overlay"><div class="card">
    <div class="sm">Stand on the marked spot and</div>
    <div class="sm"><b>face the QR code</b></div>
    <div class="big" id="cdn">3</div>
    <div class="sm">Hold still</div>
  </div></div>

  <div id="start" class="overlay">
    <div style="font-size:18px">Stand on the marked spot<br>and face the QR code</div>
    <button id="b-start">Tap to start</button>
  </div>

  <div id="loading" class="overlay">
    <div id="ltxt">Loading stage… 0%</div>
    <div id="lbar"><div id="lfill"></div></div>
  </div>

  <script>
    // ===== START SPOT (one per QR code) =====
    // x, z = metres from the CENTRE of the stage (see the guide: use ?setup=1 to find them)
    // yaw  = compass-free direction the visitor faces at start: 0 = looking toward -z,
    //        90 = toward +x, 180 = toward +z, 270 = toward -x
    // Extra QR codes: add entries and use links like  .../ar-test/?spot=A
    const SPOTS = {
      default: { x: -7.5, z: 10.0, yaw: 0 },
      A:       { x: -7.5, z: 10.0, yaw: 0 }
    };
    // ========================================

    // ===== OTHER SETTINGS =====
    const EYE = 1.6;          // eye height above the floor, metres
    const SPEED = 1.5;        // joystick walking speed, metres per second
    const LOOK_YAW = 70;      // look joystick turn speed, degrees per second
    const LOOK_PITCH = 45;    // look joystick up/down speed
    const STEP_LEN = 0.75;    // metres moved per detected step
    const STEP_THRESH = 0.7;  // lower = more sensitive step detection
    const WALK_RATE = 3;      // how quickly a step is applied, metres per second
    const COUNTDOWN = 3;      // seconds the visitor holds still facing the QR code
    const R = 1;              // keep as is
    // ==========================

    const qs = new URLSearchParams(location.search);
    const spotName = qs.get('spot') || 'default';
    const SPOT = SPOTS[spotName] || SPOTS.default;
    const SETUP = qs.get('setup') === '1';
    const baseYaw = SPOT.yaw * Math.PI / 180;

    const $ = id => document.getElementById(id);
    const mv = $('mv'), svg = $('dims'), panel = $('panel'), note = $('note');
    const bPivot = $('b-pivot'), bCtrl = $('b-ctrl'), bMeas = $('b-meas'), b3d = $('b-3d'), bAr = $('b-ar');
    const bFwd = $('b-fwd'), bAnim = $('anim');

    const NS = 'http://www.w3.org/2000/svg';
    const m2 = v => v.toFixed(2) + ' m (' + (v * 3.28084).toFixed(1) + ' ft)';
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // stage geometry in the viewer's own frame (filled in when the model loads)
    let cx = 0, cz = 0, floorY = 0;
    const eyeY = () => floorY + EYE;

    let mode = 'pivot';
    let px = 0, pz = 0;
    let view = { dx:0, dy:0, dz:-1, theta:0, phi:90, hh:0 };
    let sensHH = 0, sensP = 0, offset = null, lastHeading = 0, gotSensor = false;
    let yawOff = 0, pitchOff = 0, dirty = true;
    let listening = false, dimsOn = false, animOn = true;
    let pending = 0, lastStep = 0, base = 9.8, prevHp = 0;
    let ready = false;   // true once the visitor has finished the "face the QR code" step

    const needsPerm = typeof DeviceOrientationEvent !== 'undefined' &&
                      typeof DeviceOrientationEvent.requestPermission === 'function';
    const evName = ('ondeviceorientationabsolute' in window)
      ? 'deviceorientationabsolute' : 'deviceorientation';

    // ---------- view ----------
    function heading() { return sensHH + yawOff + baseYaw; }
    function computeView() {
      const hh = heading();
      const p = clamp(sensP + pitchOff, -1.3, 1.3);
      view.hh = hh;
      view.dx = Math.cos(p) * Math.sin(hh);
      view.dy = Math.sin(p);
      view.dz = -Math.cos(p) * Math.cos(hh);
      view.theta = Math.atan2(-view.dx, -view.dz) * 180 / Math.PI;
      view.phi = Math.acos(-view.dy) * 180 / Math.PI;
    }
    function applyView() {
      if (typeof mv.jumpCameraToGoal !== 'function') return;
      mv.cameraTarget = `${px + view.dx*R}m ${eyeY() + view.dy*R}m ${pz + view.dz*R}m`;
      mv.cameraOrbit = `${view.theta}deg ${view.phi}deg ${R}m`;
      mv.jumpCameraToGoal();
    }
    function goToSpot() {
      px = cx + SPOT.x; pz = cz + SPOT.z;
      yawOff = 0; pitchOff = 0; pending = 0;
      dirty = true;
    }

    // ---------- sensors ----------
    function dirFromEuler(a, b, gm) {
      const d = Math.PI / 180; a *= d; b *= d; gm *= d;
      const x = -Math.sin(gm)*Math.cos(a) - Math.sin(b)*Math.cos(gm)*Math.sin(a);
      const y = -Math.sin(gm)*Math.sin(a) + Math.sin(b)*Math.cos(gm)*Math.cos(a);
      const z = -Math.cos(b)*Math.cos(gm);
      return { X: x, Y: z, Z: -y };
    }
    function onOrient(e) {
      if (e.alpha === null || e.alpha === undefined) return;
      const v = dirFromEuler(e.alpha, e.beta, e.gamma);
      const h = Math.atan2(v.X, -v.Z);
      sensP = Math.asin(clamp(v.Y, -1, 1));
      lastHeading = h; gotSensor = true;
      if (offset === null) offset = h;
      sensHH = h - offset;
      dirty = true;
    }
    function onStep(e) {
      if (mode !== 'pivot' || !ready) return;
      const a = e.accelerationIncludingGravity;
      if (!a || a.x === null || a.x === undefined) return;
      const m = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
      base = base * 0.98 + m * 0.02;
      const hp = m - base;
      const now = performance.now();
      if (hp > STEP_THRESH && prevHp <= STEP_THRESH && now - lastStep > 300) {
        lastStep = now;
        pending = Math.min(pending + STEP_LEN, 3);
      }
      prevHp = hp;
    }
    async function startSensors() {
      try {
        if (needsPerm) {
          await DeviceOrientationEvent.requestPermission();
          if (typeof DeviceMotionEvent !== 'undefined' &&
              typeof DeviceMotionEvent.requestPermission === 'function') {
            await DeviceMotionEvent.requestPermission();
          }
        }
      } catch (err) {}
      if (!listening) {
        window.addEventListener(evName, onOrient, true);
        window.addEventListener('devicemotion', onStep, true);
        listening = true;
      }
    }
    function stopSensors() {
      window.removeEventListener(evName, onOrient, true);
      window.removeEventListener('devicemotion', onStep, true);
      listening = false;
    }

    // ---------- joysticks ----------
    function makeJoy(pad, knob, state) {
      const MAXR = 28; let id = null;
      function move(e) {
        const r = pad.getBoundingClientRect();
        let x = e.clientX - (r.left + r.width / 2);
        let y = e.clientY - (r.top + r.height / 2);
        const l = Math.hypot(x, y);
        if (l > MAXR) { x = x / l * MAXR; y = y / l * MAXR; }
        knob.style.transform = `translate(${x}px,${y}px)`;
        state.x = x / MAXR; state.y = -y / MAXR;
      }
      function end() { id = null; state.x = 0; state.y = 0; knob.style.transform = 'translate(0,0)'; }
      pad.addEventListener('pointerdown', e => { id = e.pointerId; pad.setPointerCapture(id); move(e); e.preventDefault(); });
      pad.addEventListener('pointermove', e => { if (e.pointerId === id) move(e); });
      pad.addEventListener('pointerup', end);
      pad.addEventListener('pointercancel', end);
    }
    const moveS = { x:0, y:0 }, lookS = { x:0, y:0 };
    makeJoy($('padMove'), $('knMove'), moveS);
    makeJoy($('padLook'), $('knLook'), lookS);

    // ---------- measurement lines ----------
    let corners = null, defs = [], els = [];
    function buildDims() {
      const d = mv.getDimensions(), c = mv.getBoundingBoxCenter();
      const x0 = c.x - d.x/2, x1 = c.x + d.x/2;
      const y0 = c.y - d.y/2, y1 = c.y + d.y/2;
      const z0 = c.z - d.z/2, z1 = c.z + d.z/2;
      corners = { A:[x0,y0,z1], B:[x1,y0,z1], C:[x1,y0,z0], D:[x1,y1,z1] };
      mv.querySelectorAll('.hs').forEach(n => n.remove());
      for (const k in corners) {
        const b = document.createElement('button');
        b.className = 'hs';
        b.slot = 'hotspot-' + k;
        b.setAttribute('data-position', corners[k].map(v => v + 'm').join(' '));
        b.setAttribute('data-normal', '0 1 0');
        b.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;';
        mv.appendChild(b);
      }
      defs = [
        { a:'A', b:'B', color:'#e53935', label:'Width ' + m2(d.x) },
        { a:'B', b:'C', color:'#2e7d32', label:'Depth ' + m2(d.z) },
        { a:'B', b:'D', color:'#1565c0', label:'Height ' + m2(d.y) }
      ];
      svg.innerHTML = '';
      els = defs.map(df => {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('stroke', df.color); l.setAttribute('stroke-width', '4');
        l.setAttribute('stroke-linecap', 'round');
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('fill', df.color); t.textContent = df.label;
        svg.appendChild(l); svg.appendChild(t);
        return { l, t };
      });
    }
    function inFront(p) {
      if (mode !== 'pivot') return true;
      return (p[0]-px)*view.dx + (p[1]-eyeY())*view.dy + (p[2]-pz)*view.dz > 0.2;
    }
    function drawDims() {
      if (!dimsOn || !corners) { svg.style.display = 'none'; return; }
      svg.style.display = 'block';
      defs.forEach((df, i) => {
        const ha = mv.queryHotspot('hotspot-' + df.a), hb = mv.queryHotspot('hotspot-' + df.b);
        const { l, t } = els[i];
        if (!ha || !hb || !inFront(corners[df.a]) || !inFront(corners[df.b])) {
          l.style.display = 'none'; t.style.display = 'none'; return;
        }
        const a = ha.canvasPosition, b = hb.canvasPosition;
        l.style.display = ''; t.style.display = '';
        l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
        l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
        t.setAttribute('x', (a.x + b.x) / 2); t.setAttribute('y', (a.y + b.y) / 2 - 6);
      });
    }

    // ---------- main loop ----------
    let lastT = performance.now();
    function tick(t) {
      const dt = Math.min(0.1, (t - lastT) / 1000);
      lastT = t;
      if (mode === 'pivot') {
        if (lookS.x || lookS.y) {
          yawOff += lookS.x * LOOK_YAW * dt * Math.PI / 180;
          pitchOff = clamp(pitchOff + lookS.y * LOOK_PITCH * dt * Math.PI / 180, -1.2, 1.2);
          dirty = true;
        }
        let fwd = moveS.y * SPEED * dt, side = moveS.x * SPEED * dt;
        if (pending > 0) { const s = Math.min(pending, WALK_RATE * dt); pending -= s; fwd += s; }
        if (fwd || side) {
          const hh = heading();
          px += Math.sin(hh) * fwd + Math.cos(hh) * side;
          pz += -Math.cos(hh) * fwd + Math.sin(hh) * side;
          dirty = true;
        }
        if (dirty) {
          computeView(); applyView(); dirty = false;
          if (SETUP) {
            const deg = ((view.hh * 180 / Math.PI) % 360 + 360) % 360;
            $('setxt').textContent = 'x: ' + (px - cx).toFixed(2) + '  z: ' + (pz - cz).toFixed(2) +
                                     '  facing: ' + Math.round(deg) + '°';
          }
        }
      }
      drawDims();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ---------- buttons / modes ----------
    function setActive(btn) {
      bPivot.classList.remove('active'); b3d.classList.remove('active');
      if (btn) btn.classList.add('active');
    }
    function pivotView(withSensors = true) {
      mode = 'pivot';
      mv.removeAttribute('camera-controls');
      offset = null; goToSpot();
      mv.fieldOfView = '65deg';
      computeView(); applyView();
      if (withSensors) startSensors();
      note.textContent = 'Turn to look · Walk to move · Controls for joysticks';
      setActive(bPivot);
    }
    function modelView() {
      mode = 'model';
      stopSensors();
      panel.style.display = 'none'; bCtrl.classList.remove('active');
      mv.setAttribute('camera-controls', '');
      mv.cameraTarget = 'auto auto auto';
      mv.cameraOrbit = '45deg 65deg auto';
      mv.fieldOfView = 'auto';
      mv.jumpCameraToGoal();
      note.textContent = 'Drag to rotate · Pinch to zoom';
      setActive(b3d);
    }

    bPivot.addEventListener('click', () => { ready = true; pivotView(true); });
    b3d.addEventListener('click', modelView);
    bCtrl.addEventListener('click', () => {
      if (mode !== 'pivot') return;
      const open = panel.style.display !== 'flex';
      panel.style.display = open ? 'flex' : 'none';
      bCtrl.classList.toggle('active', open);
    });
    bMeas.addEventListener('click', () => {
      dimsOn = !dimsOn; bMeas.classList.toggle('active', dimsOn);
    });
    bFwd.addEventListener('click', () => { offset = lastHeading; yawOff = 0; dirty = true; });
    bAnim.addEventListener('click', () => {
      animOn = !animOn;
      if (animOn) mv.play(); else mv.pause();
      bAnim.textContent = 'Animation: ' + (animOn ? 'On' : 'Off');
    });
    bAr.addEventListener('click', () => {
      stopSensors();
      panel.style.display = 'none'; bCtrl.classList.remove('active');
      setActive(null);
      if (mv.canActivateAR) { mv.activateAR(); }
      else { alert('AR is not supported on this phone or browser.'); }
    });

    // setup mode: save the current spot
    $('b-save').addEventListener('click', () => {
      const deg = ((view.hh * 180 / Math.PI) % 360 + 360) % 360;
      const yaw = (Math.round(deg / 5) * 5) % 360;
      $('saved').textContent = 'default: { x: ' + (px - cx).toFixed(2) +
                               ', z: ' + (pz - cz).toFixed(2) + ', yaw: ' + yaw + ' },';
    });

    // ---------- start-up sequence ----------
    mv.addEventListener('progress', e => {
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      $('lfill').style.width = p + '%';
      $('ltxt').textContent = 'Loading stage… ' + p + '%';
    });

    function runCountdown() {
      if (SETUP) { finishCalibration(); return; }
      const cd = $('cd'); cd.style.display = 'flex';
      let n = COUNTDOWN; $('cdn').textContent = n;
      const iv = setInterval(() => {
        n--;
        if (n <= 0) { clearInterval(iv); cd.style.display = 'none'; finishCalibration(); }
        else { $('cdn').textContent = n; }
      }, 1000);
    }
    function finishCalibration() {
      // the direction the visitor faces now (toward the QR code) becomes the start direction
      if (gotSensor) offset = lastHeading;
      goToSpot(); sensHH = 0;
      ready = true;
      computeView(); applyView();
      if (SETUP) $('setup').style.display = 'block';
    }

    let loaded = false;
    mv.addEventListener('load', () => {
      const c = mv.getBoundingBoxCenter(), d = mv.getDimensions();
      cx = c.x; cz = c.z; floorY = c.y - d.y / 2;
      buildDims();
      if (mv.availableAnimations && mv.availableAnimations.length > 0) bAnim.style.display = 'block';
      loaded = true;
      $('loading').style.display = 'none';
      goToSpot(); computeView(); applyView(); setTimeout(applyView, 300);
      if (needsPerm) { $('start').style.display = 'flex'; }
      else { runCountdown(); }
    });

    customElements.whenDefined('model-viewer').then(() => {
      mode = 'pivot';
      mv.removeAttribute('camera-controls');
      if (needsPerm) {
        $('b-start').addEventListener('click', async () => {
          $('start').style.display = 'none';
          await startSensors();
          runCountdown();
        });
      } else {
        startSensors();
      }
    });
  </script>
</body>
</html>
