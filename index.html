<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>A&M Mocap Lab · Virtual Stage</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --red:#e11d2e; --red-soft:rgba(225,29,46,.24); --ink:#0b0b0c; --muted:#9b9da3;
            --glass:rgba(11,11,12,.68); --line:rgba(255,255,255,.10); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; overflow:hidden; touch-action:none; color:#f2f2f3;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(circle at 50% 30%, #c3c6ca 0%, #80848a 55%, #54585e 100%); }
    model-viewer { position:absolute; inset:0; width:100%; height:100%;
      background:transparent; --poster-color:transparent; }
    svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8;
            stroke-linecap:round; stroke-linejoin:round; }

    .glass { background:var(--glass); border:1px solid var(--line);
      -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
      box-shadow:0 10px 30px rgba(0,0,0,.32); }

    /* top bar */
    #top { position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px; right:12px;
      display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
    #brand { display:flex; align-items:center; gap:10px; padding:7px 14px 7px 10px; border-radius:16px;
      border-left:3px solid var(--red); }
    #brand img { height:34px; width:auto; display:block; }
    #brand .t { line-height:1.2; }
    #brand .t b { display:block; font-size:11.5px; letter-spacing:.2em; font-weight:700; }
    #brand .t span { font-size:11px; color:var(--muted); }
    #tr { display:flex; gap:8px; pointer-events:auto; }
    #pivotBtn { display:flex; align-items:center; gap:4px; height:44px; padding:0 12px; border-radius:22px;
      color:var(--red); border:1.5px solid rgba(225,29,46,.7); background:rgba(11,11,12,.82); }
    #pivotBtn svg.i { width:22px; height:22px; }
    #pivotBtn svg.c { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.4;
      stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; }
    #pivotBtn.open { background:var(--red); color:var(--ink); border-color:var(--red); }
    #pivotBtn.open svg.c { transform:rotate(180deg); }
    #anim { display:none; height:44px; padding:0 14px; border-radius:22px; font-size:12px; font-weight:600;
      color:var(--red); border:1.5px solid rgba(225,29,46,.7); background:rgba(11,11,12,.82); }

    /* pivot dropdown */
    #menu { position:absolute; top:calc(env(safe-area-inset-top,0px) + 66px); right:12px; width:262px;
      border-radius:20px; padding:6px; display:none; border-top:2px solid var(--red); }
    #menu .hd { padding:10px 12px 8px; }
    #menu .hd small { display:block; font-size:10px; letter-spacing:.18em; color:var(--red); font-weight:700; }
    #menu .hd div { font-size:14px; margin-top:4px; color:#e6e6e8; font-variant-numeric:tabular-nums; }
    #menu .it { width:100%; display:flex; align-items:center; gap:12px; border:0; background:transparent;
      color:inherit; text-align:left; padding:10px 10px; border-radius:14px; border-top:1px solid var(--line); }
    #menu .it:active { background:var(--red-soft); }
    #menu .ic { flex:none; width:36px; height:36px; border-radius:50%; background:var(--red); color:var(--ink);
      display:flex; align-items:center; justify-content:center; }
    #menu .ic svg.i { width:19px; height:19px; stroke-width:2.1; }
    #menu .it .tx b { display:block; font-size:14px; font-weight:600; color:#f1f1f2; }
    #menu .it .tx small { display:block; font-size:11.5px; color:var(--muted); margin-top:2px; }
    #menu .ft { padding:9px 12px 7px; font-size:11px; color:var(--red); border-top:1px solid var(--line);
      font-variant-numeric:tabular-nums; }

    /* measurements */
    #mcard { position:absolute; top:calc(env(safe-area-inset-top,0px) + 70px); left:12px;
      padding:12px 14px; border-radius:16px; font-size:13px; display:none; min-width:200px;
      border-left:3px solid var(--red); }
    #mcard h4 { margin:0 0 8px; font-size:10px; letter-spacing:.18em; color:var(--red); font-weight:700; }
    #mcard .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
    #mcard i { width:10px; height:10px; border-radius:50%; display:inline-block; }
    #mcard .row span { color:var(--muted); width:50px; }
    #mcard .row b { font-weight:600; color:#f1f1f2; }
    #dims { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
    #dims text { font-size:13px; font-weight:700; paint-order:stroke; stroke:rgba(0,0,0,.7);
      stroke-width:4px; stroke-linejoin:round; text-anchor:middle; }

    /* toast */
    #toast { position:absolute; left:50%; transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom,0px) + 98px); padding:9px 16px 9px 14px; border-radius:20px;
      font-size:13px; opacity:0; transition:opacity .35s; pointer-events:none; white-space:nowrap;
      display:flex; align-items:center; gap:8px; }
    #toast::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--red); }
    #toast.show { opacity:1; }

    /* joysticks */
    #jpanel { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
      display:none; justify-content:space-between; align-items:flex-end; padding:12px 16px 8px;
      border-radius:24px; touch-action:none; max-width:420px; margin:0 auto; }
    .jb { text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.16em; color:var(--muted); }
    .pad { position:relative; width:104px; height:104px; border-radius:50%; margin:0 auto 6px;
      background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.28); touch-action:none; }
    .pad::after { content:""; position:absolute; inset:34px; border-radius:50%;
      border:1px dashed rgba(255,255,255,.14); }
    .knob { position:absolute; left:30px; top:30px; width:44px; height:44px; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #ff4a58, var(--red) 55%, #9d0f1b);
      box-shadow:0 3px 10px rgba(0,0,0,.5); pointer-events:none; }
    .jmid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
      gap:5px; padding:0 6px 30px; min-width:0; text-align:center; }
    .jmid small { font-size:10px; letter-spacing:.18em; color:var(--red); font-weight:700; }
    #jvals { font-size:11.5px; color:#d9d9dc; line-height:1.5; font-variant-numeric:tabular-nums; }

    /* dock */
    #dock { position:absolute; left:50%; transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; gap:4px; padding:6px;
      border-radius:28px; width:calc(100% - 24px); max-width:420px; }
    #dock button { flex:1; border:0; background:transparent; color:#cfd0d3; border-radius:22px;
      padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
      font-size:10.5px; font-weight:600; letter-spacing:.02em; transition:background .2s, opacity .2s, color .2s; }
    #dock button svg.i { width:23px; height:23px; }
    #dock button.on { background:var(--red-soft); color:var(--red); }
    #dock button.dim { opacity:.35; }

    /* overlays */
    .ov { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
      justify-content:center; gap:18px; text-align:center; padding:28px; z-index:6;
      background:radial-gradient(circle at 50% 35%, #2a2a2d 0%, #111113 70%, #070708 100%); }
    .ov img { width:210px; height:auto; }
    .ov h1 { margin:0; font-size:13px; letter-spacing:.3em; font-weight:700; color:#e6e6e8; }
    .ov p { margin:0; font-size:14px; color:var(--muted); line-height:1.5; max-width:260px; }
    #loading { display:flex; z-index:7; }
    #lbar { width:200px; height:3px; border-radius:2px; background:rgba(255,255,255,.14); overflow:hidden; }
    #lfill { height:100%; width:0; background:var(--red); transition:width .25s; }
    #start button { padding:15px 38px; font-size:15px; font-weight:700; letter-spacing:.08em; border:0;
      border-radius:30px; background:var(--red); color:#fff; box-shadow:0 8px 24px rgba(225,29,46,.35); }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="Mocap_Truss_grid.glb"
    autoplay
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    min-camera-orbit="auto auto 0.1m"
    max-camera-orbit="auto auto 200m"
    shadow-intensity="0"
    interaction-prompt="none"
    field-of-view="65deg"
    alt="Mocap stage truss">
    <div slot="progress-bar"></div>
  </model-viewer>

  <svg id="dims"></svg>

  <div id="top">
    <div id="brand" class="glass">
      <img data-logo alt="A&M Mocap Lab">
      <div class="t"><b>VIRTUAL STAGE</b><span id="sub">Stage view</span></div>
    </div>
    <div id="tr">
      <button id="anim" class="glass">Animation: On</button>
      <button id="pivotBtn" aria-label="Pivot options">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4.2M12 17.3v4.2M2.5 12h4.2M17.3 12h4.2"/></svg>
        <svg class="c" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </div>

  <div id="menu" class="glass">
    <div class="hd"><small>CURRENT POSITION</small><div id="mvals">x 0.00 · z 0.00 · 0°</div></div>
    <button class="it" id="m-go">
      <span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4.2M12 17.3v4.2M2.5 12h4.2M17.3 12h4.2"/></svg></span>
      <span class="tx"><b>Go to pivot</b><small id="m-gosub">Return to the start point</small></span>
    </button>
    <button class="it" id="m-lock">
      <span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8 10.5V7.8a4 4 0 018 0v2.7"/></svg></span>
      <span class="tx"><b>Lock current position</b><small>Save where you stand as the pivot</small></span>
    </button>
    <div class="ft" id="m-ft">Pivot · start point</div>
  </div>

  <div id="mcard" class="glass">
    <h4>STAGE SIZE</h4>
    <div class="row"><i style="background:#ff6b63"></i><span>Width</span><b id="mw"></b></div>
    <div class="row"><i style="background:#4cd07d"></i><span>Depth</span><b id="md"></b></div>
    <div class="row"><i style="background:#5aa9ff"></i><span>Height</span><b id="mh"></b></div>
  </div>

  <div id="toast" class="glass"></div>

  <div id="jpanel" class="glass">
    <div class="jb"><div class="pad" id="padMove"><div class="knob" id="knMove"></div></div>MOVE</div>
    <div class="jmid"><small>POSITION</small><div id="jvals"></div></div>
    <div class="jb"><div class="pad" id="padLook"><div class="knob" id="knLook"></div></div>LOOK</div>
  </div>

  <div id="dock" class="glass">
    <button id="b-meas">
      <svg class="i" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>
      Measure
    </button>
    <button id="b-motion">
      <svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2.2-6-2.7-2.5 1.2-4.2 3.5 1.2 2.6 2.8M11.2 15l3.8 1.5 1 4.5M7 9.5l3.7-2"/></svg>
      Motion
    </button>
    <button id="b-joy">
      <svg class="i" viewBox="0 0 24 24"><path d="M6.5 8h11a4.5 4.5 0 014.4 5.5l-.7 3a2.6 2.6 0 01-4.4 1.2L15 15.5H9l-1.8 2.2a2.6 2.6 0 01-4.4-1.2l-.7-3A4.5 4.5 0 016.5 8z"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="15.5" cy="11" r=".6" fill="currentColor"/><circle cx="17.5" cy="13" r=".6" fill="currentColor"/></svg>
      Joystick
    </button>
    <button id="b-3d">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M12 12l8.5-4.7M12 12v9.5M12 12L3.5 7.3"/></svg>
      3D View
    </button>
    <button id="b-ar">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16"/><path d="M12 8l3.5 2v4L12 16l-3.5-2v-4z"/></svg>
      AR
    </button>
  </div>

  <div id="start" class="ov">
    <img data-logo alt="A&M Mocap Lab">
    <p>Stand on the marked spot and face the QR code.</p>
    <button id="b-start">ENTER</button>
  </div>

  <div id="loading" class="ov">
    <img data-logo alt="A&M Mocap Lab">
    <h1>VIRTUAL STAGE</h1>
    <div id="lbar"><div id="lfill"></div></div>
    <p id="ltxt">Loading 0%<br>Hold your phone upright, facing the QR code</p>
  </div>

      if (!dimsOn || !corners) { svg.style.display = 'none'; return; }
      svg.style.display = 'block';
      defs.forEach((df, i) => {
        const ha = mv.queryHotspot('hotspot-' + df.a), hb = mv.queryHotspot('hotspot-' + df.b);
        const { l, t } = els[i];
        if (!ha || !hb || !inFront(corners[df.a]) || !inFront(corners[df.b])) {
          l.style.display = 'none'; t.style.display = 'none'; return;
        }
        const a = ha.canvasPosition, b = hb.canvasPosition;
        l.style.display = ''; t.style.display = '';
        l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
        l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
        t.setAttribute('x', (a.x + b.x) / 2); t.setAttribute('y', (a.y + b.y) / 2 - 6);
      });
    }

    // ---------- pivot (remembered on this phone) ----------
    let pivot = null, menuOpen = false;
    try { pivot = JSON.parse(localStorage.getItem('stagePivot') || 'null'); } catch (e) {}
    const valText = (x, z, yaw) => 'x ' + x.toFixed(2) + ' · z ' + z.toFixed(2) + ' · ' + Math.round(yaw) + '°';
    function refreshPivotText() {
      $('m-ft').textContent = pivot ? 'Pivot · ' + valText(pivot.x, pivot.z, pivot.yaw) : 'Pivot · start point';
      $('m-gosub').textContent = pivot ? 'Return to your locked position' : 'Return to the start point';
    }
    refreshPivotText();
    function updateVals() {
      const t = valText(px - cx, pz - cz, curYaw());
      if (SHOW_VALUES) $('jvals').innerHTML = t.replace(/ · /g, '<br>');
      if (menuOpen) $('mvals').textContent = t;
    }
    function goToPivot() {
      mode = 'look'; mv.removeAttribute('camera-controls'); mv.fieldOfView = '65deg';
      px = cx + pivot.x; pz = cz + pivot.z; pending = 0; pitchOff = 0;
      yawOff = wrap(pivot.yaw * Math.PI / 180 - sensHH - baseYaw);     // face the locked direction
      ready = true; computeView(); applyView(); dirty = true;
      $('sub').textContent = 'Stage view';
      b3d.classList.remove('on'); bMotion.classList.remove('dim'); bJoy.classList.remove('dim');
    }
    function setMenu(open) {
      menuOpen = open;
      $('menu').style.display = open ? 'block' : 'none';
      $('pivotBtn').classList.toggle('open', open);
      if (open) updateVals();
    }
    $('pivotBtn').addEventListener('click', e => { e.stopPropagation(); setMenu(!menuOpen); });
    $('menu').addEventListener('click', e => e.stopPropagation());
    window.addEventListener('click', () => { if (menuOpen) setMenu(false); });

    $('m-go').addEventListener('click', async () => {
      setMenu(false);
      if (mode === 'orbit') await toStage();
      if (pivot) { goToPivot(); toast('Back at your locked pivot'); }
      else { enterStage(); toast('Back at the start point'); }
    });
    $('m-lock').addEventListener('click', () => {
      if (mode !== 'look') { toast('Switch to stage view to lock a position'); setMenu(false); return; }
      pivot = { x: px - cx, z: pz - cz, yaw: curYaw() };
      try { localStorage.setItem('stagePivot', JSON.stringify(pivot)); } catch (e) {}
      refreshPivotText(); setMenu(false); toast('Pivot locked at your current position');
    });

    // ---------- main loop ----------
    let lastT = performance.now();
    function tick(t) {
      const dt = Math.min(0.1, (t - lastT) / 1000);
      lastT = t;
      if (mode === 'look') {
        if (lookS.x || lookS.y) {
          yawOff += lookS.x * LOOK_YAW * dt * Math.PI / 180;
          pitchOff = clamp(pitchOff + lookS.y * LOOK_PITCH * dt * Math.PI / 180, -1.2, 1.2);
          dirty = true;
        }
        let fwd = moveS.y * SPEED * dt, side = moveS.x * SPEED * dt;
        if (motionOn && pending > 0) { const s = Math.min(pending, WALK_RATE * dt); pending -= s; fwd += s; }
        if (fwd || side) {
          const hh = sensHH + yawOff + baseYaw;
          px += Math.sin(hh) * fwd + Math.cos(hh) * side;
          pz += -Math.cos(hh) * fwd + Math.sin(hh) * side;
          dirty = true;
        }
        if (dirty && ready) { computeView(); applyView(); dirty = false; updateVals(); }
      }
      drawDims();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ---------- modes ----------
    function enterStage() {
      // The direction the visitor faces right now becomes the fixed start direction.
      mode = 'look';
      mv.removeAttribute('camera-controls');
      mv.fieldOfView = '65deg';
      offset = gotSensor ? lastHeading : null; sensHH = 0; if (!gotSensor) sensP = 0;
      goToSpot(); ready = true;
      computeView(); applyView(); dirty = true;
      $('sub').textContent = 'Stage view';
      b3d.classList.remove('on'); bMotion.classList.remove('dim'); bJoy.classList.remove('dim');
    }
    function toOrbit() {
      mode = 'orbit';
      stopSensors();
      $('jpanel').style.display = 'none'; bJoy.classList.remove('on');
      mv.setAttribute('camera-controls', '');
      mv.cameraTarget = 'auto auto auto';
      mv.cameraOrbit = '45deg 65deg auto';
      mv.fieldOfView = 'auto';
      mv.jumpCameraToGoal();
      $('sub').textContent = '3D view · drag to rotate, pinch to zoom';
      b3d.classList.add('on'); bMotion.classList.add('dim'); bJoy.classList.add('dim');
    }
    async function toStage() {
      await startSensors();
      offset = null; gotSensor = false;       // next sensor reading sets the start direction
      mode = 'look';
      mv.removeAttribute('camera-controls');
      mv.fieldOfView = '65deg';
      sensHH = 0; sensP = 0; goToSpot(); ready = true;
      computeView(); applyView(); dirty = true;
      $('sub').textContent = 'Stage view';
      b3d.classList.remove('on'); bMotion.classList.remove('dim'); bJoy.classList.remove('dim');
    }

    b3d.addEventListener('click', () => { if (mode === 'look') toOrbit(); else toStage(); });
    bJoy.addEventListener('click', () => {
      if (mode !== 'look') return;
      const open = $('jpanel').style.display !== 'flex';
      $('jpanel').style.display = open ? 'flex' : 'none';
      bJoy.classList.toggle('on', open);
    });
    bMotion.addEventListener('click', () => {
      if (mode !== 'look') return;
      motionOn = !motionOn; pending = 0;
      bMotion.classList.toggle('on', motionOn);
      toast(motionOn ? 'Motion on · walk to move through the stage' : 'Motion off · look around from one point');
    });
    bMeas.addEventListener('click', () => {
      dimsOn = !dimsOn; bMeas.classList.toggle('on', dimsOn);
      $('mcard').style.display = dimsOn ? 'block' : 'none';
    });
    bAr.addEventListener('click', () => {
      if (mv.canActivateAR) mv.activateAR();
      else toast('AR is not supported on this phone or browser');
    });
    $('anim').addEventListener('click', () => {
      animOn = !animOn; if (animOn) mv.play(); else mv.pause();
      $('anim').textContent = 'Animation: ' + (animOn ? 'On' : 'Off');
    });

    // ---------- start-up ----------
    mv.addEventListener('progress', e => {
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      $('lfill').style.width = p + '%';
      $('ltxt').innerHTML = 'Loading ' + p + '%<br>Hold your phone upright, facing the QR code';
    });
    mv.addEventListener('load', () => {
      const c = mv.getBoundingBoxCenter(), d = mv.getDimensions();
      cx = c.x; cz = c.z; floorY = c.y - d.y / 2;
      buildDims();
      if (mv.availableAnimations && mv.availableAnimations.length > 0) $('anim').style.display = 'block';
      $('loading').style.display = 'none';
      if (needsPerm) { $('start').style.display = 'flex'; }
      else { enterStage(); setTimeout(applyView, 300); }
    });
    customElements.whenDefined('model-viewer').then(() => {
      mv.removeAttribute('camera-controls');
      if (needsPerm) {
        $('b-start').addEventListener('click', async () => {
          await startSensors();
          setTimeout(() => { $('start').style.display = 'none'; enterStage(); }, 400);
        });
      } else { startSensors(); }
    });
  </script>
</body>
</html>
