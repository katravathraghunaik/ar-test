<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Model in AR</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; height:100%; font-family:sans-serif; background:#f2f2f2; }
    model-viewer { width:100%; height:100%; }
    #ar-btn {
      position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
      padding:14px 26px; font-size:17px; border:0; border-radius:28px;
      background:#1a73e8; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.3);
    }
    #hint { position:absolute; top:12px; width:100%; text-align:center; font-size:14px; color:#444; }
  </style>
</head>
<body>
  <div id="hint">Drag to rotate · Tap “View in AR” and point at a flat surface</div>
  <model-viewer
    src="model.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    auto-rotate
    camera-orbit="45deg 65deg auto"
    shadow-intensity="1"
    alt="3D model">
    <button slot="ar-button" id="ar-btn">View in AR</button>
  </model-viewer>
</body>
</html>
